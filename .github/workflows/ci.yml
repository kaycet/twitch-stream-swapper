name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      # Redesign safety gate: every element ID referenced from JS must still
      # exist in the markup. Cheap, and only useful if it actually runs.
      - name: Audit DOM hooks
        run: npm run audit:dom

      # Catch packaging breakage (missing/renamed runtime files) on the PR
      # instead of at release time.
      - name: Package extension ZIP (smoke test)
        run: npm run package


