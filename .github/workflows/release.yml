name: Release (Package ZIP)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and publish (example: v1.0.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # On tag push, github.ref is the tag. On manual runs, use the provided tag.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Package extension ZIP
        run: npm run package

      - name: Detect CRX signing key
        id: crx_key
        shell: bash
        env:
          CRX_PRIVATE_KEY_B64: ${{ secrets.CRX_PRIVATE_KEY_B64 }}
        run: |
          if [ -n "${CRX_PRIVATE_KEY_B64:-}" ]; then
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_key=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Chrome (for CRX signing)
        if: ${{ steps.crx_key.outputs.has_key == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/google-linux-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-linux-keyring.gpg] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Build signed CRX (Verified CRX uploads)
        if: ${{ steps.crx_key.outputs.has_key == 'true' }}
        shell: bash
        env:
          CRX_PRIVATE_KEY_B64: ${{ secrets.CRX_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./manifest.json').version")"
          echo "${CRX_PRIVATE_KEY_B64}" | base64 -d > privatekey.pem

          # Pack extension using Chrome. Output will be alongside the extension directory.
          google-chrome --no-sandbox --pack-extension="dist/extension" --pack-extension-key="privatekey.pem"

          # Normalize output name into dist/ for release artifacts.
          if [ -f "dist/extension.crx" ]; then
            mv "dist/extension.crx" "dist/twitch-stream-swapper-${VERSION}.crx"
          elif [ -f "dist/extension/extension.crx" ]; then
            mv "dist/extension/extension.crx" "dist/twitch-stream-swapper-${VERSION}.crx"
          else
            echo "CRX output not found" >&2
            ls -la dist || true
            exit 1
          fi

      - name: Upload build artifact (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: twitch-stream-swapper-zip
          path: dist/*.zip
          if-no-files-found: error

      - name: Upload CRX artifact (Actions)
        if: ${{ steps.crx_key.outputs.has_key == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: twitch-stream-swapper-crx
          path: dist/*.crx
          if-no-files-found: error

      - name: Create GitHub Release + upload ZIP
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.crx
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true

      - name: Detect Chrome Web Store credentials
        id: cws_creds
        shell: bash
        env:
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
        run: |
          if [ -n "${CWS_EXTENSION_ID:-}" ] && [ -n "${CWS_CLIENT_ID:-}" ] && [ -n "${CWS_REFRESH_TOKEN:-}" ]; then
            echo "has_creds=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
          fi

      # Runs after the GitHub Release so a store hiccup never blocks the release itself.
      # Setup: https://developer.chrome.com/docs/webstore/using-api — then add repo secrets
      # CWS_EXTENSION_ID, CWS_CLIENT_ID, CWS_CLIENT_SECRET, CWS_REFRESH_TOKEN, CWS_PUBLISHER_ID.
      - name: Upload + submit to Chrome Web Store
        if: ${{ steps.cws_creds.outputs.has_creds == 'true' }}
        shell: bash
        env:
          EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
        run: |
          set -euo pipefail
          ZIP="$(ls dist/*.zip | head -n 1)"
          echo "Uploading ${ZIP} to Chrome Web Store"
          npx --yes chrome-webstore-upload-cli@3 --source "$ZIP"


